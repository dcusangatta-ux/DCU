<style>
:root{--ink:#222222;--ink2:#484848;--mute:#6A6A6A;--line:#EBEBEB;--line2:#DDDDDD;--soft:#F7F7F7;--chip:#F2F2F2;--red:#E31E24;--red-d:#B3141A;--red-bg:#FFF0F0;--green:#008A05;--green-d:#006B04;--green-bg:#EAF6EA;--amber:#B25000;--amber-bg:#FFF4E5;--blue:#0B5DA7;--blue-bg:#EAF2FA;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:Figtree,-apple-system,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:0;z-index:10;background:#FFFFFF;border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:16px;height:76px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.upd{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.circ svg{width:19px;height:19px}
.circ.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{margin:22px auto 0;max-width:980px;display:grid;grid-template-columns:1fr 1fr 0.9fr 1.3fr auto;align-items:center;border:1px solid var(--line);border-radius:999px;box-shadow:0 3px 12px rgba(0,0,0,.10);background:#FFFFFF}
.seg{display:flex;flex-direction:column;gap:1px;padding:12px 24px;border-radius:999px;min-width:0;position:relative}
.seg+.seg::before{content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line2)}
.seg:focus-within{background:var(--soft)}
.seg b{font-size:12px;font-weight:700}
.seg input,.seg select{border:0;outline:0;padding:0;background:transparent;font-size:15px;color:var(--ink2);width:100%;appearance:none;-webkit-appearance:none}
.go{width:48px;height:48px;border-radius:50%;background:var(--red);border:0;margin-right:8px;display:flex;align-items:center;justify-content:center}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.presets button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;font-size:13px;font-weight:600;white-space:nowrap}
.presets button:hover{border-color:var(--ink)}
.presets button.on{border:2px solid var(--ink);background:var(--soft);font-weight:700;padding:0 13px}
.tabs{display:flex;gap:28px;overflow-x:auto;margin-top:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:6px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab b{font-size:14px;font-weight:700}
.tab small{font-size:12px;font-weight:600}
.tab:hover{color:var(--ink);border-bottom-color:var(--line2)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:28px 0 60px}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.headline h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
.headline p{margin:4px 0 0;color:var(--mute);font-size:15px}
.ghost{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;background:#FFFFFF;text-align:left}
.kpi span{font-size:13px;font-weight:700;color:var(--mute)}
.kpi strong{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.05}
.kpi strong small{font-size:16px;color:var(--mute);font-weight:700;letter-spacing:0}
.kpi em{font-style:normal;font-size:13px;color:var(--mute)}
.kpi.main{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.kpi.main span,.kpi.main em,.kpi.main strong small{color:#C9C9C9}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.kpi.main .bar{background:#4A4A4A}
.kpi.main .bar i{background:#FFFFFF}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
h2.sec{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:40px 0 14px;font-size:22px;font-weight:700;letter-spacing:-.3px}
h2.sec em{font-style:normal;font-size:14px;font-weight:600;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.fcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#FFFFFF;text-align:left;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.fcard:hover{box-shadow:0 6px 20px rgba(0,0,0,.10)}
.fcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fcard .t b{font-size:17px;font-weight:800}
.fcard .t span{font-size:13px;color:var(--mute);font-weight:600}
.fcard strong{font-size:30px;font-weight:800;letter-spacing:-.6px}
.fcard .m{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.fcard .m .bad{color:var(--red-d);font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ph b{font-size:17px;font-weight:800}
.ph b small{font-size:14px;color:var(--mute);font-weight:700;margin-left:6px}
.plist{max-height:520px;overflow:auto}
.prow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.pi{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.pi b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green-d)}
.b-bad{background:var(--red-bg);color:var(--red-d)}
.b-warn{background:var(--amber-bg);color:#8A3E00}
.b-n{background:var(--chip);color:var(--ink2)}
.empty{padding:28px 18px;text-align:center;color:var(--mute);font-size:14px}
.alerts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.alerts{grid-template-columns:minmax(0,1fr)}}
.alert{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.alert .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF;font-weight:800}
.alert b{font-size:15px}
.alert p{margin:2px 0 0;font-size:14px;color:var(--ink2);line-height:1.4}
.okbox{border-radius:14px;padding:16px;background:var(--green-bg);color:var(--green-d);font-weight:700;font-size:15px}
.chart{border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px;position:relative}
.cbars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:170px;border-bottom:1px solid var(--line2);position:relative}
.cbars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--mute)}
.cbars .gl span{position:absolute;right:0;top:-15px;background:#FFFFFF;padding-left:4px}
.cb{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;z-index:1}
.cb i{display:block;width:100%;max-width:36px;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.cb.sel i{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px var(--ink)}
.cb:hover i{opacity:.8}
.clabels{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;margin-top:8px;font-size:11px;color:var(--mute);text-align:center}
.tip{position:absolute;z-index:20;background:var(--ink);color:#FFFFFF;border-radius:10px;padding:8px 12px;font-size:13px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%)}
.periods{display:flex;gap:8px}
.periods button{white-space:nowrap;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;font-size:13px;font-weight:600}
.periods button.on{border:2px solid var(--ink);background:var(--soft);font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:var(--mute);text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{width:28px;height:28px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.rank.r1{background:var(--ink);color:#FFFFFF}
.rank.r2,.rank.r3{background:#D9D9D9}
.note{font-size:13px;color:var(--mute);line-height:1.5;margin-top:28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:50}
.lock{max-width:380px;margin:90px auto;text-align:center;display:flex;flex-direction:column;gap:14px;padding:0 20px}
.lock input{height:54px;border-radius:12px;border:1px solid #B0B0B0;padding:0 16px;font-size:20px;text-align:center;letter-spacing:6px}
.btn{height:52px;border-radius:12px;border:0;background:var(--red);color:#FFFFFF;font-size:16px;font-weight:700}
.load{padding:80px 0;text-align:center;color:var(--mute)}
.scrollx{overflow-x:auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.summary{margin-top:14px;font-size:18px;line-height:1.5;color:var(--ink2);max-width:900px}
.summary b{color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.st-g{background:var(--green-bg);color:var(--green-d)}.st-a{background:var(--amber-bg);color:#8A3E00}.st-r{background:var(--red-bg);color:var(--red-d)}.st-n{background:var(--chip);color:var(--mute)}
.fill-g{background:var(--green)!important}.fill-a{background:#E07A00!important}.fill-r{background:var(--red)!important}
.delta{font-size:13px;font-weight:700}
.up{color:var(--green-d)}.down{color:var(--red-d)}.flat{color:var(--mute)}
.kpi.main .up{color:#7CDB7F}.kpi.main .down{color:#FF8A8E}.kpi.main .flat{color:#C9C9C9}
.overview{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;margin-top:28px;align-items:start}
.stbl td,.stbl th{padding:10px 16px}
.stbl tr.click{cursor:pointer}
.stbl tr.click:hover td{background:var(--soft)}
.stbl .barcell{width:34%}
.mini{display:flex;align-items:center;gap:10px}
.mini .bar{flex:1}
.mini b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.alerts.compact{display:flex;flex-direction:column;gap:8px;padding:12px}
.alerts.compact .alert{padding:10px 12px}
.alerts.compact .alert .ic{width:28px;height:28px;font-size:13px}
.dtabs{display:flex;gap:8px;margin:40px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.dtab{border:0;background:transparent;padding:10px 4px 12px;margin-right:18px;font-size:16px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.dtab.on{color:var(--ink);border-bottom-color:var(--ink)}
.heat td{padding:4px;text-align:center}
.heat th{padding:8px 4px;text-align:center}
.heat th:first-child,.heat td:first-child{text-align:left;padding-left:16px;font-weight:700}
.hc{display:block;min-width:46px;border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;border:0;width:100%;font-variant-numeric:tabular-nums}
.hc-g{background:#CDEBCD;color:#0B4D0E}.hc-a{background:#FFE2BF;color:#6E3300}.hc-r{background:#FFD0D2;color:#8A0F14}.hc-n{background:var(--chip);color:var(--mute)}
.hc.sel{outline:2px solid var(--ink);outline-offset:1px}
.heat tr.selrow td:first-child{color:var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
@media (max-width:1000px){.overview{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.stbl .stcol{display:none}.stbl .barcell{width:auto;min-width:120px}}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .topin{height:66px}.brand small{display:none}.upd span{display:none}
  .pill{grid-template-columns:1fr 1fr;border-radius:20px;margin-top:16px}
  .seg{border-radius:20px;padding:10px 16px}
  .seg:nth-child(3),.seg:nth-child(4){grid-column:1/-1;border-top:1px solid var(--line)}
  .seg:nth-child(3)::before,.seg:nth-child(4)::before{display:none}
  .presets{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .go{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.main{grid-column:1/-1}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .headline h1{font-size:24px}
  .cbars{height:130px;gap:3px}.clabels{gap:3px;font-size:10px}
  .hide-sm{display:none}
  th,td{padding:10px 12px}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title = s => String(s).toLowerCase().replace(/(^|[\s.\-'(\/])([a-z])/g, (m,a,b) => a + b.toUpperCase());
const initials = s => String(s).split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join("").toUpperCase();
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const tglPanjang = s => { const d = parseYmd(s); return HARI[d.getDay()] + ", " + d.getDate() + " " + BLN[d.getMonth()] + " " + d.getFullYear(); };
const jamDari = min => { const d = new Date(min * 60000); return pad(d.getHours()) + "." + pad(d.getMinutes()); };
const menitHari = min => { const d = new Date(min * 60000); return d.getHours() * 60 + d.getMinutes(); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const hhmm = s => { const [h,m] = s.split(":").map(Number); return h * 60 + m; };
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

/* ============ DATA ============ */
let PIN = ""; try { PIN = localStorage.getItem("dcuDash.pin") || ""; } catch(e){}
let ROSTER = [];          // [no, nama, status, fungsi, posisi, tipe]
let ROWS = [];            // [tgl, giliran, no, nama, fungsi, fit, isiMenit, sis, dia, flag, alasan, ket, status, posisi]
let DARI = "";
let UPDATED = null;
const q0 = new URLSearchParams(location.search);
const today = ymd(new Date());
let S = { dari: "", tgl: q0.get("tgl") || today, fungsi: (q0.get("fungsi") || "Semua").toUpperCase() === "SEMUA" ? "Semua" : (q0.get("fungsi") || "").toUpperCase(), pola: "Semua", q: "", periode: "7", detail: "nama", loading: false, needPin: false, err: "" };

if (!S.dari) S.dari = q0.get("dari") && q0.get("dari") <= S.tgl ? q0.get("dari") : S.tgl;
const MAKS_HARI = 92;
const isRange = () => S.dari < S.tgl;
function rangeDays(a, b){ const out = []; const akhir = (b || S.tgl) > today ? today : (b || S.tgl); for (let d = a || S.dari; d <= akhir; d = addDays(d, 1)) out.push(d); return out; }
const selisihHari = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
function getJSON(url){
  return fetch(url).then(r => r.json()).catch(() => new Promise((ok, no) => {
    const cb = "cb" + Date.now() + Math.floor(Math.random()*1000), sc = document.createElement("script");
    const t = setTimeout(() => { delete window[cb]; sc.remove(); no(new Error("timeout")); }, 20000);
    window[cb] = d => { clearTimeout(t); delete window[cb]; sc.remove(); ok(d); };
    sc.onerror = () => { clearTimeout(t); delete window[cb]; sc.remove(); no(new Error("gagal")); };
    sc.src = url + "&callback=" + cb; document.head.appendChild(sc);
  }));
}
const api = (q) => CONFIG.API_URL + "?" + q + "&pin=" + encodeURIComponent(PIN) + "&t=" + Date.now();

async function muat(penuh){
  if (S.loading) return; S.loading = true; setSpin(true);
  try {
    const lenR = selisihHari(S.dari, S.tgl) + 1;
    const butuh = [addDays(S.tgl, -35), addDays(S.dari, -lenR)].sort()[0];
    const dari = penuh || !DARI || butuh < DARI ? butuh : addDays(S.tgl > today ? today : S.tgl, -1);
    const [d, p] = await Promise.all([ getJSON(api("action=data&dari=" + dari)), ROSTER.length && !penuh ? Promise.resolve(null) : getJSON(api("action=pekerja")) ]);
    if (!d.ok) { if (d.pin) { S.needPin = true; S.err = PIN ? "PIN salah" : ""; render(); return; } throw new Error(d.error || "Gagal memuat data"); }
    if (p) { if (!p.ok) throw new Error(p.error || "Daftar pekerja gagal dimuat"); ROSTER = p.list; }
    if (dari < DARI || !DARI) { ROWS = d.rows; DARI = dari; }
    else { ROWS = ROWS.filter(r => r[0] < dari).concat(d.rows); }
    UPDATED = new Date(); S.needPin = false; S.err = "";
    render();
  } catch (e) {
    S.err = e.message || "Gagal memuat"; if (!ROWS.length && !ROSTER.length) render(); else toast("Gagal memperbarui: " + S.err);
  } finally { S.loading = false; setSpin(false); }
}
function setSpin(on){ const b = $("#btnRefresh"); if (b) b.classList.toggle("spin", on); }

/* ============ HITUNG ============ */
const pk = (no, nama) => no ? String(no) : "X:" + String(nama).toUpperCase();
function rosterFilter(fungsi, pola){
  return ROSTER.filter(w => (fungsi === "Semua" || w[3] === fungsi) && (pola === "Semua" || (pola === "Non-shift" ? w[5] === "N" : w[5] !== "N")));
}
function idxTanggal(){
  const m = {};
  ROWS.forEach(r => { (m[r[0]] = m[r[0]] || []).push(r); });
  return m;
}
function statusHari(tgl, fungsi, pola, IDX){
  const ros = rosterFilter(fungsi, pola), rec = {};
  (IDX[tgl] || []).forEach(r => { if (fungsi !== "Semua" && r[4] !== fungsi) return; (rec[pk(r[2], r[3])] = rec[pk(r[2], r[3])] || []).push(r); });
  const sudah = [], belum = [];

  if (cn) cn.onclick = () => {
    const R = rekapRange(S.fungsi, S.pola, idxTanggal(), S.dari, S.tgl), list = R.never.filter(o => cocok(o.w)).sort((a, b) => a.w[3].localeCompare(b.w[3]) || a.w[1].localeCompare(b.w[1]));
    salin("*Tidak pernah DCU – " + (S.fungsi === "Semua" ? "Semua fungsi" : "Fungsi " + S.fungsi) + "*\n_" + tglRange(S.dari, S.tgl) + "_\n\n" + list.map((o, i) => (i + 1) + ". " + title(o.w[1]) + (S.fungsi === "Semua" ? " (" + o.w[3] + ")" : "") + (o.w[4] ? " – " + o.w[4] : "")).join("\n") + "\n\nTotal: " + list.length + " orang", "Daftar disalin. Tinggal tempel di WA.");
  };
  $("#fPola").onchange = e => { S.pola = e.target.value; render(); };
  const fq = $("#fQ"); let tq;
  fq.oninput = () => { clearTimeout(tq); tq = setTimeout(() => { S.q = fq.value.trim(); render(); const n = $("#fQ"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $("#goSearch").onclick = () => { S.detail = "nama"; render(); const el = $("#belum"); if (el) el.scrollIntoView({ behavior: "smooth" }); };
  const mp = $("#morePerhatian");
  if (mp) mp.onclick = () => { S.semuaPerhatian = !S.semuaPerhatian; render(); };
  const cp = $("#copyBelum");
  if (cp) cp.onclick = () => {
    const st = statusHari(S.tgl, S.fungsi, S.pola, idxTanggal());
    const list = st.belum.filter(x => cocok(x.w)).sort((a, b) => a.w[3].localeCompare(b.w[3]) || a.w[1].localeCompare(b.w[1]));
    const teks = "*Belum DCU – " + (S.fungsi === "Semua" ? "Semua fungsi" : "Fungsi " + S.fungsi) + "*\n_" + tglPanjang(S.tgl) + "_\n\n" + list.map((x, i) => (i + 1) + ". " + title(x.w[1]) + (S.fungsi === "Semua" ? " (" + x.w[3] + ")" : "") + (x.w[4] ? " – " + x.w[4] : "")).join("\n") + "\n\nTotal: " + list.length + " orang";
    salin(teks, "Daftar belum DCU disalin. Tinggal tempel di WA.");
  };
  const sh = $("#shareLink");
  if (sh) sh.onclick = () => { const u = location.origin + location.pathname + "?fungsi=" + encodeURIComponent(S.fungsi); salin(u, "Link fungsi " + S.fungsi + " disalin."); };
  const cb = $("#cbars");
  if (cb) {
    let tip = null;
    cb.onmousemove = e => { const b = e.target.closest(".cb"); if (!b) { if (tip) { tip.remove(); tip = null; } return; } if (!tip) { tip = document.createElement("div"); tip.className = "tip"; cb.parentElement.appendChild(tip); } tip.textContent = b.dataset.tip; const r = cb.parentElement.getBoundingClientRect(), br = b.getBoundingClientRect(); tip.style.left = (br.left - r.left + br.width / 2) + "px"; tip.style.top = (br.top - r.top + br.height - b.querySelector("i").offsetHeight - 8) + "px"; };
    cb.onmouseleave = () => { if (tip) { tip.remove(); tip = null; } };
    cb.onclick = e => { const b = e.target.closest(".cb"); if (b) { S.tgl = S.dari = b.dataset.tgl; setURL(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
  }
}
function salin(teks, pesan){
  const ok = () => toast(pesan);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(teks).then(ok, () => fallback());
  else fallback();
  function fallback(){ const t = document.createElement("textarea"); t.value = teks; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch(e){ toast("Gagal menyalin"); } t.remove(); }
}

render();
if (!CONFIG.API_URL) { S.err = "API_URL belum diisi"; render(); }
else { muat(true); setInterval(() => { if (!document.hidden && !S.needPin) muat(false); }, CONFIG.REFRESH_DETIK * 1000); }
</script>
